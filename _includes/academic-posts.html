<div class="post-list">{% for post in site.posts limit: include.limit %}<article class="post-row"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time><div><h3><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h3><span class="muted">{{ post.category }} <span aria-hidden="true">/</span> 한국어</span></div><span aria-hidden="true">↗</span></article>{% endfor %}</div>
