title: Jinuk Huh
url: "https://heojinuk.github.io"
baseurl: ""
timezone: Asia/Seoul
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-redirect-from
defaults:
  - scope:
      path: "_posts"
    values:
      layout: academic-post
      lang: ko
      permalink: /posts/:path
exclude: ["Gemfile", "Gemfile.lock", "README.md", "LICENSE.txt", "docs", "vendor", "node_modules", "package.json", "pnpm-lock.yaml", "scripts", "블로그 글쓰기.command"]
